name: atc-form

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: atc-form-nginx
    ports:
      - "${APP_BIND_IP:-127.0.0.5}:${APP_PORT:-80}:80"
    networks:
      default:
        aliases:
          - atc.form
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    image: atc-form-php:8.5
    container_name: atc-form-php
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./:/var/www/html
      - composer-cache:/tmp/composer
    depends_on:
      mysql:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: atc-form-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-atc_form}
      MYSQL_USER: ${DB_USERNAME:-atc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${APP_BIND_IP:-127.0.0.5}:${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: atc-form-mailpit
    ports:
      - "${APP_BIND_IP:-127.0.0.5}:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    restart: unless-stopped

  node:
    image: node:22-alpine
    container_name: atc-form-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "${APP_BIND_IP:-127.0.0.5}:${VITE_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    profiles:
      - frontend

volumes:
  mysql-data:
  composer-cache:
