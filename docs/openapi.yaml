openapi: 3.0.3
info:
  title: ATC Express Calculator API
  version: 1.0.0
  description: |
    REST JSON API for the public delivery calculator and admin tariff import panel.
    Money and weight fields are decimal strings (not JSON numbers).
    Dates are ISO-8601.
servers:
  - url: http://atc.form/api/v1
    description: Local Docker (nginx)
tags:
  - name: Public
  - name: Admin Auth
  - name: Admin Imports
  - name: Admin Tariffs
  - name: Admin Settings
paths:
  /calculator/bootstrap:
    get:
      tags: [Public]
      summary: Preload all calculator form reference data
      description: |
        Single payload for `/calculator`: platforms, all active delivery channels
        of the active revision, and public exchange rate. Served from file/DB cache
        (`CACHE_STORE`), invalidated on tariff activation/rollback and rate change.
        Response includes `Cache-Control: private, max-age=300`. Angular also caches
        in memory and localStorage (TTL 15 minutes).
      operationId: getCalculatorBootstrap
      responses:
        '200':
          description: Form bootstrap payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculatorBootstrap'
              example:
                platforms:
                  - code: ozon
                    name: Ozon
                  - code: yandex_market
                    name: Yandex Market
                delivery_channels:
                  - code: atc-standard-big
                    name: ATC Standard Big
                    platform: ozon
                    currency: CNY
                  - code: yandex-express
                    name: Express
                    platform: yandex_market
                    currency: RUB
                settings:
                  rub_to_cny_rate: '0.085000'
                  updated_at: '2026-08-21T21:00:00+00:00'

  /platforms:
    get:
      tags: [Public]
      summary: List platforms
      operationId: listPlatforms
      responses:
        '200':
          description: Fixed platform list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Platform'
              example:
                - code: ozon
                  name: Ozon
                - code: yandex_market
                  name: Yandex Market

  /delivery-channels:
    get:
      tags: [Public]
      summary: Active delivery channels for a platform
      operationId: listDeliveryChannels
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PlatformCode'
      responses:
        '200':
          description: Channels from the active tariff revision (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryChannel'
              example:
                - code: atc-standard-big
                  name: ATC Standard Big
                  platform: ozon
                  currency: CNY

  /settings/public:
    get:
      tags: [Public]
      summary: Public RUB to CNY exchange rate
      operationId: getPublicSettings
      responses:
        '200':
          description: Active exchange rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSettings'
              example:
                rub_to_cny_rate: '0.085000'
                updated_at: '2026-08-21T21:00:00+00:00'

  /calculations:
    post:
      tags: [Public]
      summary: Calculate delivery cost
      operationId: calculate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
            examples:
              ozon:
                summary: Ozon with dimensions and order cost
                value:
                  platform: ozon
                  delivery_channel_code: atc-standard-big
                  physical_weight_grams: '1000'
                  length_cm: '20'
                  width_cm: '15'
                  height_cm: '10'
                  order_cost: '500'
                  order_cost_currency: CNY
              yandex:
                summary: Yandex Market (weight only)
                value:
                  platform: yandex_market
                  delivery_channel_code: yandex-express
                  physical_weight_grams: '1500'
      responses:
        '200':
          description: Pricing result (eligible true or false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResult'
              examples:
                ozonEligible:
                  summary: Ozon eligible
                  value:
                    eligible: true
                    platform:
                      code: ozon
                      name: Ozon
                    channel:
                      code: atc-standard-big
                      name: ATC Standard Big
                    currency: CNY
                    physical_weight_grams: '1000.000'
                    volumetric_weight_grams: '500.000'
                    chargeable_weight_grams: '1000.000'
                    fixed_fee: '12.000000'
                    rate_per_gram: '0.05000000'
                    final_cost: '62.000000'
                    order_cost: '500.0000'
                    order_cost_currency: CNY
                    order_cost_cny: '500.0000'
                    errors: []
                    warnings: []
                yandexEligible:
                  summary: Yandex eligible
                  value:
                    eligible: true
                    platform:
                      code: yandex_market
                      name: Yandex Market
                    channel:
                      code: yandex-express
                      name: Yandex Express
                    currency: RUB
                    physical_weight_grams: '1500.000'
                    billed_weight_grams: '1500.000'
                    fixed_fee: '199.000000'
                    rate_per_kg: '50.000000'
                    final_cost: '274.000000'
                    exchange_rate: '0.085000'
                    final_cost_cny: '23.290000'
                    errors: []
                    warnings: []
                notEligible:
                  summary: Not eligible
                  value:
                    eligible: false
                    platform:
                      code: ozon
                      name: Ozon
                    channel:
                      code: atc-standard-big
                      name: ATC Standard Big
                    currency: CNY
                    physical_weight_grams: '50000.000'
                    fixed_fee: null
                    final_cost: null
                    errors:
                      - 'Physical weight exceeds the maximum allowed for this channel.'
                    warnings: []
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/login:
    post:
      tags: [Admin Auth]
      summary: Admin login (Sanctum token)
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              email: admin@atc.form
              password: password
      responses:
        '200':
          description: Bearer token and user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/logout:
    post:
      tags: [Admin Auth]
      summary: Revoke current token
      operationId: adminLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              example:
                message: Logged out.

  /admin/me:
    get:
      tags: [Admin Auth]
      summary: Current admin user
      operationId: adminMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /admin/imports:
    get:
      tags: [Admin Imports]
      summary: Paginated import history
      operationId: listImports
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ImportStatus'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Laravel paginator (withoutWrapping)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportListPage'
    post:
      tags: [Admin Imports]
      summary: Upload XLSX tariff workbook
      operationId: uploadImport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Only .xlsx; max size from TARIFF_IMPORT_MAX_BYTES
      responses:
        '201':
          description: Import detail after sync processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/imports/{import}:
    get:
      tags: [Admin Imports]
      summary: Import details
      operationId: getImport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Detail with summary, parsed tariffs, diff, errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDetail'

  /admin/imports/{import}/activate:
    post:
      tags: [Admin Imports]
      summary: Activate validated draft revision
      operationId: activateImport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Updated import detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDetail'
        '422':
          $ref: '#/components/responses/DomainError'

  /admin/imports/{import}/rollback:
    post:
      tags: [Admin Imports]
      summary: Reactivate archived revision (rollback)
      operationId: rollbackImport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Updated import detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDetail'
        '422':
          $ref: '#/components/responses/DomainError'

  /admin/tariffs:
    get:
      tags: [Admin Tariffs]
      summary: Read-only tariffs
      operationId: listTariffs
      security:
        - bearerAuth: []
      parameters:
        - name: platform
          in: query
          schema:
            $ref: '#/components/schemas/PlatformCode'
        - name: revision_id
          in: query
          schema:
            type: integer
            minimum: 1
          description: Defaults to the active revision
      responses:
        '200':
          description: Tariff rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminTariff'

  /admin/settings:
    get:
      tags: [Admin Settings]
      summary: Admin settings with audit
      operationId: getAdminSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exchange rate and last editor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'

  /admin/settings/exchange-rate:
    put:
      tags: [Admin Settings]
      summary: Update RUB to CNY rate
      operationId: updateExchangeRate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rub_to_cny_rate]
              properties:
                rub_to_cny_rate:
                  type: string
                  description: Decimal string greater than zero
                  example: '0.091'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    ImportId:
      name: import
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: The given data was invalid.
            code: validation_error
            errors:
              email:
                - The provided credentials are incorrect.
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Unauthenticated.
            code: unauthenticated
            errors: {}
    DomainError:
      description: Domain rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    PlatformCode:
      type: string
      enum: [ozon, yandex_market]

    ImportStatus:
      type: string
      enum:
        - uploaded
        - processing
        - validation_failed
        - validated
        - activated
        - failed

    Platform:
      type: object
      required: [code, name]
      properties:
        code:
          $ref: '#/components/schemas/PlatformCode'
        name:
          type: string

    CalculatorBootstrap:
      type: object
      required: [platforms, delivery_channels, settings]
      properties:
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/Platform'
        delivery_channels:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryChannel'
        settings:
          $ref: '#/components/schemas/PublicSettings'

    DeliveryChannel:
      type: object
      required: [code, name, platform, currency]
      properties:
        code:
          type: string
        name:
          type: string
        platform:
          $ref: '#/components/schemas/PlatformCode'
        currency:
          type: string

    PublicSettings:
      type: object
      required: [rub_to_cny_rate, updated_at]
      properties:
        rub_to_cny_rate:
          type: string
        updated_at:
          type: string
          format: date-time

    CalculationRequest:
      type: object
      required: [platform, delivery_channel_code, physical_weight_grams]
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        delivery_channel_code:
          type: string
        physical_weight_grams:
          type: string
        length_cm:
          type: string
        width_cm:
          type: string
        height_cm:
          type: string
        order_cost:
          type: string
        order_cost_currency:
          type: string
          enum: [CNY, RUB]

    NamedCode:
      type: object
      properties:
        code:
          type: string
        name:
          type: string

    CalculationResult:
      type: object
      required:
        - eligible
        - platform
        - channel
        - currency
        - physical_weight_grams
        - fixed_fee
        - final_cost
        - errors
        - warnings
      properties:
        eligible:
          type: boolean
        platform:
          $ref: '#/components/schemas/NamedCode'
        channel:
          $ref: '#/components/schemas/NamedCode'
        currency:
          type: string
        physical_weight_grams:
          type: string
        volumetric_weight_grams:
          type: string
          nullable: true
        chargeable_weight_grams:
          type: string
          nullable: true
        billed_weight_grams:
          type: string
          nullable: true
        fixed_fee:
          type: string
          nullable: true
        rate_per_gram:
          type: string
          nullable: true
        rate_per_kg:
          type: string
          nullable: true
        final_cost:
          type: string
          nullable: true
        order_cost:
          type: string
          nullable: true
        order_cost_currency:
          type: string
          nullable: true
        order_cost_cny:
          type: string
          nullable: true
        exchange_rate:
          type: string
          nullable: true
        final_cost_cny:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    AdminUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email

    LoginResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/AdminUser'

    AdminSettings:
      type: object
      required: [rub_to_cny_rate, updated_at, updated_by]
      properties:
        rub_to_cny_rate:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          allOf:
            - $ref: '#/components/schemas/AdminUser'
          nullable: true

    AdminTariff:
      type: object
      properties:
        id:
          type: integer
        revision_id:
          type: integer
        platform:
          $ref: '#/components/schemas/PlatformCode'
        code:
          type: string
        name:
          type: string
        active:
          type: boolean
        currency:
          type: string
        chargeable_weight_type:
          type: string
          nullable: true
        fixed_fee:
          type: string
          nullable: true
        per_gram_fee:
          type: string
          nullable: true
        per_kg_fee:
          type: string
          nullable: true
        billing_increment_grams:
          type: integer
          nullable: true
        volumetric_divisor:
          type: string
          nullable: true
        min_weight_grams:
          type: string
          nullable: true
        max_weight_grams:
          type: string
          nullable: true
        max_length_cm:
          type: string
          nullable: true
        max_sum_dimensions_cm:
          type: string
          nullable: true
        min_order_cost_rub:
          type: string
          nullable: true
        max_order_cost_rub:
          type: string
          nullable: true
        min_order_cost_cny:
          type: string
          nullable: true
        max_order_cost_cny:
          type: string
          nullable: true
        import_source_row:
          type: integer
          nullable: true

    ImportListPage:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        links:
          type: object
        meta:
          type: object

    ImportDetail:
      type: object
      description: Full import payload for admin UI tabs
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/ImportStatus'
        original_filename:
          type: string
        summary:
          type: object
          nullable: true
        diff:
          type: object
          nullable: true
        parsed:
          type: object
        errors:
          type: array
          items:
            type: object
        revision:
          type: object
          nullable: true
        actions:
          type: object
          properties:
            can_activate:
              type: boolean
            can_rollback:
              type: boolean

    ApiError:
      type: object
      required: [message, code, errors]
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
