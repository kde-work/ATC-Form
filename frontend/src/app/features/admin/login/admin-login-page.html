<div class="page">
  <app-site-header title="Admin panel" />

  <main>
    <h1 class="page__heading">Admin login</h1>
    <p class="page__lead">Sign in to manage tariff imports and settings.</p>

    @if (formError()) {
      <div class="alert alert--error" role="alert">{{ formError() }}</div>
    }

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="fieldError('email') ? true : null"
          [attr.aria-describedby]="fieldError('email') ? 'email-error' : null"
        />
        @if (fieldError('email'); as message) {
          <p id="email-error" class="field__error" role="alert">{{ message }}</p>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="fieldError('password') ? true : null"
          [attr.aria-describedby]="fieldError('password') ? 'password-error' : null"
        />
        @if (fieldError('password'); as message) {
          <p id="password-error" class="field__error" role="alert">{{ message }}</p>
        }
      </div>

      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </main>
</div>
