# Локальный nginx для Laravel. Document root: public/.
# На хостинге используйте тот же root и try_files, но fastcgi_pass на unix-сокет PHP-FPM.
server {
    listen 80;
    listen [::]:80;
    server_name atc.form;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    # Windows bind-mount: sendfile отдаёт прежнее содержимое файла, пока не перезапустить контейнер.
    sendfile off;
    tcp_nopush off;
    open_file_cache off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
