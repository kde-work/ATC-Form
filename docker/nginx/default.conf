# Локальный nginx: API/Laravel public + Angular SPA (same-origin).
# Prod-стратегия: собрать frontend (`cd frontend && npm run build`), nginx отдаёт
# `frontend/dist/frontend/browser`. Dev-альтернатива: profile `frontend` → ng serve :4200.
#
# CORS не нужен для браузера на http://atc.form: UI и /api с одного origin.
# Для ng serve на :4200 используется proxy (см. frontend/proxy.conf.json).

server {
    listen 80;
    listen [::]:80;
    server_name atc.form;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;
    client_max_body_size 64M;

    # Windows bind-mount: sendfile отдаёт прежнее содержимое файла, пока не перезапустить контейнер.
    sendfile off;
    tcp_nopush off;
    open_file_cache off;

    # --- Laravel API ---
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    # --- Статика из Laravel public (логотип, favicon, PWA) ---
    location ^~ /images/ {
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location = /favicon-96x96.png {
        try_files $uri =404;
    }

    location = /apple-touch-icon.png {
        try_files $uri =404;
    }

    location = /site.webmanifest {
        try_files $uri =404;
    }

    location = /web-app-manifest-192x192.png {
        try_files $uri =404;
    }

    location = /web-app-manifest-512x512.png {
        try_files $uri =404;
    }

    # --- Angular SPA (production build) ---
    location / {
        root /var/www/html/frontend/dist/frontend/browser;
        try_files $uri $uri/ @spa;
    }

    location @spa {
        root /var/www/html/frontend/dist/frontend/browser;
        try_files /index.html =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
