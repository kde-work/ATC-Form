memory_limit=4G
upload_max_filesize=64M
post_max_size=64M
max_execution_time=600
max_input_time=600
display_errors=On
display_startup_errors=On
error_reporting=E_ALL
date.timezone=Europe/Moscow

; На Windows Docker bind-mount без кэшей Laravel грузит /api за ~9с и жрёт CPU:
; каждый include идёт в медленный FS. realpath_cache обязателен.
; OPcache нужен для нормальной скорости (~0.1с после прогрева).
; revalidate_freq=2: не дергать mtime на каждый request через bind-mount.
; Если правка PHP-файла не подхватывается: docker restart atc-form-php
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
opcache.file_update_protection=0
realpath_cache_size=4096K
realpath_cache_ttl=600

[xdebug]
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.discover_client_host=0
xdebug.start_with_request=trigger
xdebug.idekey=CURSOR
